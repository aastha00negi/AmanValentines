<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You, Aman ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
    }
    .container {
      padding: 30px 20px;
      max-width: 420px;
      margin: auto;
    }
    .card {
      background: rgba(255,255,255,0.15);
      padding: 20px;
      border-radius: 20px;
      margin: 20px 0;
    }
    button {
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
    }
    .yes {
      background: #ff2f68;
      color: white;
    }
    .no {
      background: white;
      color: #ff2f68;
    }
  </style>
</head>
<body>

<div class="container" id="main">
  <h1>Hey Aman ❤️</h1>
  <p>
    From college days to forever feels…  
    there’s something I need to ask you 🥺
  </p>

  <div class="card">
    <h2>Will you be my Valentine? 🌹</h2>
    <button class="yes" onclick="yesClicked()">YES ❤️</button>
    <button class="no" onclick="alert('Wrong answer 😌 Try again ❤️')">
      Hmm 🤔
    </button>
  </div>
</div>

<script>
  function yesClicked() {
    document.getElementById("main").innerHTML = `
      <h1>YOU SAID YES 😭❤️</h1>
      <p>You just made me the happiest girl 💖</p>
      <h2>Happy Valentine’s Day 💕</h2>
    `;
  }
</script>

</body>
</html>
